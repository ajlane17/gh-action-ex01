name: Deploy Project
on: [push, workflow_dispatch]
jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v3
        - name: Install NodeJS
          uses: actions/setup-node@v3
          with:
              node-version: '18'
        - name: Install Dependencies
          run: npm ci
        - name: Run Linter
          run: npm run lint